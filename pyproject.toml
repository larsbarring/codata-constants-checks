[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-review"
version = "0.1.0"
description = "Reproducible review checks and fixes for the CODATA DRUM Constants repositories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lars", email = "lars.barring@smhi.se" }]
dependencies = ["rdflib>=7.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
drum-review-checks = "drum_review.checks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
